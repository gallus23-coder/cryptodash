<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cryptodash v2 — Decision log</title>
<style>
  :root { --bg: #0f1117; --panel: #161925; --border: #2a2f3d; --text: #e6e8ec; --muted: #8b92a5; --accent: #22c55e; --amber: #d97706; --red: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .mode-pill { font-family: monospace; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(217,119,6,0.15); color: var(--amber); border: 1px solid rgba(217,119,6,0.3); }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  #scorecard { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  #filters { display: flex; gap: 10px; margin-bottom: 14px; }
  #filters select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .cycle-row { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; cursor: pointer; }
  .cycle-row:hover { border-color: var(--accent); }
  .cycle-row .ts { color: var(--muted); font-family: monospace; font-size: 12px; }
  .cycle-row .line { margin-top: 4px; }
  .cycle-row.has-error .line { color: var(--red); }
  #expand { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 14px; margin-top: 10px; display: none; }
  .candidate-block { border-top: 1px solid var(--border); padding: 10px 0; }
  .plain-panel { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
  .panel { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .panel table { width: 100%; border-collapse: collapse; }
  .panel td, .panel th { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .guardrail-bar-track { background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; margin-top: 4px; }
  .guardrail-bar-fill { background: var(--accent); height: 100%; }
  .hidden { display: none; }
  #tab-bar { display: flex; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
  #tab-bar button { background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  #tab-bar button:hover { color: var(--text); }
  #tab-bar button.active { color: var(--text); border-color: var(--accent); background: rgba(34,197,94,0.1); }
</style>
</head>
<body>
<header>
  <strong>cryptodash v2</strong>
  <span class="mode-pill">PAPER</span>
</header>
<nav id="tab-bar">
  <button data-tab="decisionLog" class="active">Decision log</button>
  <button data-tab="charts">Charts</button>
  <button data-tab="strategy">Strategy</button>
  <button data-tab="golive">Go-live checklist</button>
</nav>
<main>
  <section id="decision-log-tab">
    <div id="benchmark-panel" class="panel">Loading benchmark…</div>
    <div id="scorecard">Loading scorecard…</div>
    <div id="filters">
      <select id="regime-filter">
        <option value="">All regimes</option>
        <option value="trend_up">trend_up</option>
        <option value="range">range</option>
        <option value="downtrend">downtrend</option>
        <option value="risk_off">risk_off</option>
      </select>
    </div>
    <div id="timeline">Loading cycles…</div>
    <div id="expand"></div>
  </section>

  <section id="charts-tab" class="hidden">
    <div id="chart-controls">
      <select id="coin-select">
        <option value="BTC">BTC</option>
        <option value="ETH">ETH</option>
        <option value="SOL">SOL</option>
        <option value="XRP">XRP</option>
        <option value="ADA">ADA</option>
        <option value="LINK">LINK</option>
      </select>
      <select id="tf-select">
        <option value="1h">1h</option>
        <option value="4h" selected>4h</option>
        <option value="1d">1d</option>
      </select>
      <label><input type="checkbox" id="toggle-ema20" checked /> EMA20</label>
      <label><input type="checkbox" id="toggle-ema50" checked /> EMA50</label>
      <label><input type="checkbox" id="toggle-ema200" /> EMA200</label>
      <label><input type="checkbox" id="toggle-bollinger" /> Bollinger</label>
      <button data-range-days="7">1W</button>
      <button data-range-days="30">1M</button>
      <button data-range-days="90">3M</button>
      <button data-range-days="">ALL</button>
    </div>
    <div id="chart" style="height: 400px;"></div>
    <div id="regime-band" style="height: 20px;"></div>
    <div id="indicator-panel" style="height: 150px;"></div>
  </section>

  <section id="strategy-tab" class="hidden">
    <div id="regime-card" class="panel">Loading regime…</div>
    <div id="market-note" class="panel">Loading market note…</div>
    <div id="setups-table" class="panel">Loading setups…</div>
    <div id="open-positions" class="panel">Loading positions…</div>
    <div id="guardrails-panel" class="panel">Loading guardrails…</div>
    <div id="config-editor" class="panel">
      <h3>Edit strategy</h3>
      <label>Risk level:
        <select id="risk-level-select">
          <option value="cautious">Cautious</option>
          <option value="normal" selected>Normal</option>
          <option value="bold">Bold (currently same as Normal — see note)</option>
        </select>
      </label>
      <div id="setup-toggles"></div>
      <button id="backtest-button">Backtest changes</button>
      <div id="backtest-result"></div>
      <button id="submit-button" disabled>Save as pending</button>
      <div id="pending-proposal"></div>
    </div>
  </section>

  <section id="golive-tab" class="hidden">
    <div id="golive-checklist" class="panel">Loading go-live checklist…</div>
  </section>
</main>
<script type="module" src="/js/benchmark.mjs"></script>
<script type="module" src="/js/scorecard.mjs"></script>
<script type="module" src="/js/timeline.mjs"></script>
<script type="module" src="/js/chart.mjs"></script>
<script type="module" src="/js/strategy.mjs"></script>
<script type="module" src="/js/config-editor.mjs"></script>
<script type="module" src="/js/golive.mjs"></script>
<script type="module" src="/js/tabs.mjs"></script>
</body>
</html>
