<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cryptodash v2 — Decision log</title>
<style>
  :root { --bg: #0f1117; --panel: #161925; --border: #2a2f3d; --text: #e6e8ec; --muted: #8b92a5; --accent: #22c55e; --amber: #d97706; --red: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .mode-pill { font-family: monospace; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(217,119,6,0.15); color: var(--amber); border: 1px solid rgba(217,119,6,0.3); }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  #scorecard { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  #filters { display: flex; gap: 10px; margin-bottom: 14px; }
  #filters select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .cycle-row { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; cursor: pointer; }
  .cycle-row:hover { border-color: var(--accent); }
  .cycle-row .ts { color: var(--muted); font-family: monospace; font-size: 12px; }
  .cycle-row .line { margin-top: 4px; }
  .cycle-row.has-error .line { color: var(--red); }
  #expand { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 14px; margin-top: 10px; display: none; }
  .candidate-block { border-top: 1px solid var(--border); padding: 10px 0; }
  .plain-panel { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <strong>cryptodash v2</strong>
  <span class="mode-pill">PAPER</span>
</header>
<main>
  <div id="scorecard">Loading scorecard…</div>
  <div id="filters">
    <select id="regime-filter">
      <option value="">All regimes</option>
      <option value="trend_up">trend_up</option>
      <option value="range">range</option>
      <option value="downtrend">downtrend</option>
      <option value="risk_off">risk_off</option>
    </select>
  </div>
  <div id="timeline">Loading cycles…</div>
  <div id="expand"></div>
</main>
<script type="module" src="/js/scorecard.mjs"></script>
<script type="module" src="/js/timeline.mjs"></script>
</body>
</html>
